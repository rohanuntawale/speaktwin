# ============================================================
# SpeakTwin backend — Fly.io
#
#   fly launch --no-deploy      # claims the app name
#   fly secrets set GROQ_API_KEY=... CORS_ORIGINS=https://your.vercel.app
#   fly deploy
#
# Fly is the better option if you want local Whisper: unlike Render's
# free tier you can pick the memory size, and 1 GB comfortably holds
# the tiny.en model.
# ============================================================
app = "speaktwin"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8000"
  LOG_LEVEL = "INFO"
  RATE_LIMIT_PER_MINUTE = "60"
  SESSION_TTL_SECONDS = "3600"
  # Local Whisper fits here. Switch to "groq" and set the secret if you
  # would rather keep the instance small and cold-start fast.
  STT_ENGINE = "local"
  WHISPER_MODEL = "tiny.en"
  WHISPER_COMPUTE_TYPE = "int8"

[http_service]
  internal_port = 8000
  force_https = true
  # Sessions live in process memory, so a request must reach the machine
  # that started the session. Keep one machine, or move the store to
  # Redis before scaling out.
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    soft_limit = 8
    hard_limit = 16

[[http_service.checks]]
  grace_period = "60s"
  interval = "30s"
  method = "GET"
  timeout = "10s"
  path = "/api/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
